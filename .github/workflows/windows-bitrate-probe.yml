name: Windows workspace-context bitrate diagnostic

on:
  push:
    branches: [allenrchan/sdk-windows-workspace-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bitrate:
    if: github.repository == 'allenrchan/livekit-rust-sdks'
    name: Workspace bitrate (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream
            source: 3c688ad6f1f587b9cff052dea2b44cd484ce7228
          - label: pr1531-ci-merge
            source: 892d4d0dfc581570718593927b4f5b8350ddb6e0
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: never
      CARGO_TARGET_DIR: target
      RUST_BACKTRACE: full
      RUST_LOG: info
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: livekit/rust-sdks
          ref: ${{ matrix.source }}
          submodules: true
          persist-credentials: false

      - name: Setup matching Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          target: x86_64-pc-windows-msvc
          cache: false
          rustflags: ''

      - name: Install matching Protoc
        uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6 # v2.1.0
        with:
          version: '25.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record immutable source and toolchain
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bitrate-proof"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          {
            git rev-parse HEAD
            git rev-parse HEAD:libwebrtc/src/native/peer_connection.rs
            git rev-parse HEAD:webrtc-sys/src/peer_connection.cpp
            git rev-parse HEAD:Cargo.lock
            rustup run 1.97.1 rustc -Vv
            rustup run 1.97.1 cargo -V
            protoc --version
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unavailable}" "${ImageVersion:-unavailable}"
          } | tee "$RUNNER_TEMP/bitrate-proof/source.txt"

      # Keep the original workspace build/feature context. Filter execution to
      # the one native case, so no SFU-dependent E2E test is silently omitted
      # from a claimed full-suite result. No cache restore or retries.
      - name: Retain workspace feature context
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER CC CXX LK_CUSTOM_WEBRTC LK_DEBUG_WEBRTC
          rustup run 1.97.1 cargo tree --locked \
            --target x86_64-pc-windows-msvc \
            --features __lk-e2e-test -e features -i libwebrtc \
            2>&1 | tee "$RUNNER_TEMP/bitrate-proof/workspace-features.log"

      - name: Execute exact bitrate case in workspace context once
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER CC CXX LK_CUSTOM_WEBRTC LK_DEBUG_WEBRTC
          rustup run 1.97.1 cargo test --locked --verbose --no-fail-fast \
            --target x86_64-pc-windows-msvc \
            --features __lk-e2e-test \
            imp::peer_connection::tests::set_bitrate \
            -- --exact --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/bitrate-proof/workspace-case.log"
          test "$(grep -F -c 'test imp::peer_connection::tests::set_bitrate ... ok' "$RUNNER_TEMP/bitrate-proof/workspace-case.log")" = 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"

      - name: Retain bounded diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-workspace-bitrate-${{ matrix.label }}
          path: ${{ runner.temp }}/bitrate-proof/
          if-no-files-found: warn
          retention-days: 7
